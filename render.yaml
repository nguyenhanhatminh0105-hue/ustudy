# One-click deploy to Render: https://render.com/docs/blueprint-spec
# The embedded database (PGlite) needs about 600 MB of memory, more than the
# free plan's 512 MB, so this deploy uses an external PostgreSQL instead.
# Render asks for DATABASE_URL when the Blueprint is created: paste the
# connection string of any PostgreSQL 14+ (a free Neon database works).
services:
  - type: web
    name: ustudy
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "1"
