# One-click deploy to Render: https://render.com/docs/blueprint-spec
# The free plan has no persistent disk, so the embedded database starts fresh
# on every deploy or restart and the sample accounts are seeded again. That
# suits a public demo. For data that lasts, add DATABASE_URL (any PostgreSQL 14+).
services:
  - type: web
    name: ustudy
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "1"
