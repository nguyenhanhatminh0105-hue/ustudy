<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Course admin · UStudy</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="/theme-boot.js"></script>
</head>
<body>
  <div class="app">
    <nav class="rail" id="rail"></nav>
    <main class="main" id="main">
      <div class="page">
        <header class="page-head">
          <div>
            <h1>Course admin</h1>
            <p>Post an assignment once and every student can add it to their list.</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" id="add" type="button"><i data-icon="plus"></i>Post assignment</button>
          </div>
        </header>
        <div id="denied" class="empty" hidden>
          <h2>Staff only</h2>
          <p>This page is for course staff. Your own assignments live on the Assignments page.</p>
          <a class="btn" href="/assignments.html">Go to Assignments</a>
        </div>
        <ul class="task-list" id="list"></ul>
      </div>
    </main>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">Post assignment</h2>
        <button class="btn btn-quiet btn-icon" type="button" data-close aria-label="Close"><i data-icon="x"></i></button>
      </div>
      <form id="form" class="form-grid" novalidate>
        <div class="form-row">
          <div class="field">
            <label for="o-course">Course</label>
            <input class="input" id="o-course" name="course" maxlength="40" required />
          </div>
          <div class="field">
            <label for="o-hours">Estimated hours</label>
            <input class="input" id="o-hours" name="estimatedHours" type="number" min="1" max="200" value="3" required />
          </div>
        </div>
        <div class="field">
          <label for="o-title">Title</label>
          <input class="input" id="o-title" name="title" maxlength="160" required />
        </div>
        <div class="field">
          <label for="o-due">Due</label>
          <input class="input" id="o-due" name="dueAt" type="datetime-local" required />
        </div>
        <div class="field">
          <span class="label" id="o-priority-label">Priority</span>
          <div class="segmented" role="radiogroup" aria-labelledby="o-priority-label">
            <label><input type="radio" name="priority" value="low" /><span>Low</span></label>
            <label><input type="radio" name="priority" value="medium" checked /><span>Medium</span></label>
            <label><input type="radio" name="priority" value="high" /><span>High</span></label>
          </div>
        </div>
        <div class="field">
          <label for="o-desc">Instructions</label>
          <textarea class="textarea" id="o-desc" name="description" maxlength="4000"></textarea>
        </div>
        <p class="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button class="btn btn-danger btn-quiet" type="button" id="delete" hidden><i data-icon="trash"></i>Delete</button>
          <span class="spacer"></span>
          <button class="btn" type="button" data-close>Cancel</button>
          <button class="btn btn-primary" type="submit" id="save">Post</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="./src/pages/admin.js"></script>
</body>
</html>
